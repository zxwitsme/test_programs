<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #eee;
    touch-action: none;
  }
  h1 { font-size: 1.6rem; margin-bottom: 10px; letter-spacing: 2px; color: #4ecca3; }
  #scoreboard {
    display: flex; gap: 30px; margin-bottom: 12px; font-size: 1rem;
  }
  #scoreboard span { color: #4ecca3; font-weight: bold; font-size: 1.2rem; }
  canvas {
    border: 2px solid #4ecca3;
    border-radius: 8px;
    box-shadow: 0 0 20px #4ecca355;
    display: block;
  }
  #overlay {
    position: absolute;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
  }
  #overlay h2 { font-size: 1.8rem; color: #ff6b6b; }
  #overlay p  { font-size: 1.1rem; color: #eee; }
  button {
    padding: 12px 32px;
    font-size: 1rem;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 6px;
  }
  button:active { opacity: 0.8; }
  #dpad {
    display: none;
    margin-top: 20px;
    gap: 0;
  }
  #dpad button {
    width: 64px; height: 64px;
    font-size: 1.4rem;
    padding: 0;
    border-radius: 12px;
    background: #16213e;
    color: #4ecca3;
    border: 2px solid #4ecca3;
  }
  .drow { display: flex; justify-content: center; }
  @media (pointer: coarse) { #dpad { display: grid; } }
</style>
</head>
<body>
<h1>贪吃蛇</h1>
<div id="scoreboard">
  得分：<span id="score">0</span> &nbsp; 最高：<span id="best">0</span>
</div>
<div style="position:relative">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">贪吃蛇</h2>
    <p id="ovMsg">手机：滑动屏幕控制方向<br>电脑：方向键 / WASD</p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>
<div id="dpad">
  <div class="drow"><button data-d="up">▲</button></div>
  <div class="drow">
    <button data-d="left">◀</button>
    <button data-d="down" style="margin:0 8px">▼</button>
    <button data-d="right">▶</button>
  </div>
</div>

<script>
const CELL = 20;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg   = document.getElementById('ovMsg');
const startBtn = document.getElementById('startBtn');

let COLS, ROWS, snake, dir, nextDir, food, score, best = 0, timer, running = false;

function resize() {
  const size = Math.min(window.innerWidth - 16, window.innerHeight - 220, 480);
  COLS = Math.floor(size / CELL);
  ROWS = Math.floor(size / CELL);
  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;
}

function rnd(n) { return Math.floor(Math.random() * n); }

function spawnFood() {
  const cells = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!snake.some(s => s[0]===r && s[1]===c)) cells.push([r,c]);
  return cells[rnd(cells.length)];
}

function startGame() {
  const midR = Math.floor(ROWS/2), midC = Math.floor(COLS/2);
  snake = [[midR, midC],[midR, midC-1],[midR, midC-2]];
  dir = [0,1]; nextDir = [0,1];
  score = 0; scoreEl.textContent = 0;
  food = spawnFood();
  overlay.style.display = 'none';
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, 140);
}

function tick() {
  dir = nextDir;
  const head = [snake[0][0]+dir[0], snake[0][1]+dir[1]];
  if (head[0]<0||head[0]>=ROWS||head[1]<0||head[1]>=COLS||
      snake.some(s=>s[0]===head[0]&&s[1]===head[1])) {
    gameOver(); return;
  }
  snake.unshift(head);
  if (head[0]===food[0]&&head[1]===food[1]) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
    food = spawnFood();
    clearInterval(timer);
    const speed = Math.max(60, 140 - Math.floor(score/50)*10);
    timer = setInterval(tick, speed);
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  clearInterval(timer); running = false;
  ovTitle.textContent = '游戏结束';
  ovMsg.textContent = `得分：${score}`;
  startBtn.textContent = '再玩一局';
  overlay.style.display = 'flex';
  draw();
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#ffffff11';
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    ctx.fillRect(c*CELL+CELL/2-1, r*CELL+CELL/2-1, 2, 2);
  }

  // Food
  const [fr,fc] = food;
  const fx = fc*CELL+CELL/2, fy = fr*CELL+CELL/2, rad = CELL/2-2;
  const gf = ctx.createRadialGradient(fx,fy,1,fx,fy,rad);
  gf.addColorStop(0,'#ffdd57'); gf.addColorStop(1,'#ff6b6b');
  ctx.fillStyle = gf;
  ctx.beginPath(); ctx.arc(fx,fy,rad,0,Math.PI*2); ctx.fill();

  // Snake
  snake.forEach(([r,c],i) => {
    const x=c*CELL+1, y=r*CELL+1, s=CELL-2;
    const alpha = i===0?1:Math.max(0.4,1-i*0.03);
    ctx.fillStyle = i===0
      ? `rgba(78,204,163,${alpha})`
      : `rgba(22,160,133,${alpha})`;
    ctx.beginPath();
    ctx.roundRect(x,y,s,s,i===0?6:4);
    ctx.fill();
    if (i===0) {
      // Eyes
      const ex = dir[1]===1?x+s-6:dir[1]===-1?x+3:x+s/2-4;
      const ey = dir[0]===1?y+s-6:dir[0]===-1?y+3:y+s/2-4;
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(ex,ey,2.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex+(dir[1]===0?8:0),ey+(dir[0]===0?8:0),2.5,0,Math.PI*2); ctx.fill();
    }
  });
}

// Keyboard
const KEYS = {
  ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],
  w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]
};
document.addEventListener('keydown', e => {
  if (!running) return;
  const d = KEYS[e.key];
  if (d && d[0]+dir[0]!==0 || d && d[1]+dir[1]!==0) {
    if(d && !(d[0]+dir[0]===0&&d[1]+dir[1]===0)) nextDir=d;
    if(d) e.preventDefault();
  }
});

// Touch swipe
let tx=0,ty=0;
canvas.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!running) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
  let d;
  if(Math.abs(dx)>Math.abs(dy)) d=dx>0?[0,1]:[0,-1];
  else d=dy>0?[1,0]:[-1,0];
  if(!(d[0]+dir[0]===0&&d[1]+dir[1]===0)) nextDir=d;
},{passive:true});

// D-pad buttons
document.querySelectorAll('#dpad button').forEach(btn=>{
  const map={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
  btn.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(!running) return;
    const d=map[btn.dataset.d];
    if(!(d[0]+dir[0]===0&&d[1]+dir[1]===0)) nextDir=d;
  },{passive:false});
});

startBtn.addEventListener('click', startGame);
window.addEventListener('resize', ()=>{ resize(); if(!running) draw(); });

resize();
draw();
</script>
</body>
</html>
